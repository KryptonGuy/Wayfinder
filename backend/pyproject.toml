[project]
name = "wayfinder-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for WayFinder."
readme = "README.md"
authors = [
    { name = "KryptonGuy", email = "yash.sant.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "langchain==0.3.14",
    "langchain-google-genai==2.0.8",
    "langgraph==0.2.61",
    "pydantic-settings==2.7.1",
    "uvicorn[standard]==0.34.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
